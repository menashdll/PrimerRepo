site_name: Cuadratura Gaussiana

nav:
  - Inicio: index.md
  - Explicación: explanation.md
  - Tutorial: tutorials.md
  - Referencia: reference.md

plugins:
  - mkdocstrings

theme:
  name: material

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
